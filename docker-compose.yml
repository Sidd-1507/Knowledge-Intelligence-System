version: '3.8'

services:
  kis-app:
    build: .
    container_name: knowledge-intelligence-system
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  chroma_data:
